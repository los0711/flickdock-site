name: Build FlickDock website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Upload Retiehe site files
        uses: actions/upload-artifact@v4
        with:
          name: flickdock-retiehe-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
