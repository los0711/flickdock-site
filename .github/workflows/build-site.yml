name: Build and deploy FlickDock Worker website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload Worker static site files
        uses: actions/upload-artifact@v4
        with:
          name: flickdock-worker-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Check Worker deployment configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### Worker automatic deployment is not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "The site was built successfully. Add a scoped CLOUDFLARE_API_TOKEN repository secret to enable deployment. Local npm run deploy remains available." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy Worker website
        if: ${{ github.ref == 'refs/heads/main' && steps.cloudflare.outputs.configured == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy
